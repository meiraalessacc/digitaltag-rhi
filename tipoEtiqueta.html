<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>RHI MAGNESITA - Tipo de Etiqueta</title>
</head>

<body>

    <section class="centro-tipo">

        <div class="titulo-tipo">
            <h1>
                Informe o
                <span>Tipo de Etiqueta</span>
            </h1>
        </div>

        <div class="tipos">

            <a href="formulario.html?tipo=vermelha" class="quadrado-vermelha">
                <h1>Etiqueta Vermelha</h1>
                <p>Manutenção</p>
            </a>

            <a href="formulario.html?tipo=azul" class="quadrado-azul">
                <h1>Etiqueta Azul</h1>
                <p>Operação</p>
            </a>

            <a href="formulario.html?tipo=amarela" class="quadrado-amarela">
                <h1>Etiqueta Amarela</h1>
                <p>Projetos</p>
            </a>

        </div>

    </section>
    <script>
        const params = new URLSearchParams(window.location.search);

        const planta = params.get("planta");
        const equipamento = params.get("equipamento");

        document.querySelector(".quadrado-vermelha").href =
            `formulario.html?tipo=vermelha&planta=${encodeURIComponent(planta)}&equipamento=${encodeURIComponent(equipamento)}`;

        document.querySelector(".quadrado-azul").href =
            `formulario.html?tipo=azul&planta=${encodeURIComponent(planta)}&equipamento=${encodeURIComponent(equipamento)}`;

        document.querySelector(".quadrado-amarela").href =
            `formulario.html?tipo=amarela&planta=${encodeURIComponent(planta)}&equipamento=${encodeURIComponent(equipamento)}`;

        console.log(document.querySelector(".quadrado-vermelha").href);
    </script>

</body>

</html>
