
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>RHI MAGNESITA | Relatório de Etiquetas</title>
</head>

<body>

    <main class="container-relatorio">

        <header class="titulo-relatorio">
            <h1>
                Relatório de
                <span>Etiquetas</span>
            </h1>

            <p>
                Registros de anomalias cadastrados
            </p>
        </header>


        <section class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Nome</th>
                        <th>Matrícula</th>
                        <th>Planta</th>
                        <th>Equipamento</th>
                        <th>Descrição</th>
                        <th>Data</th>
                        <th>Imagem</th>
                    </tr>
                </thead>

                <tbody id="tabelaRegistros">

                    <tr>
                        <td colspan="7">
                            Carregando registros...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>


    <script src="relatorio.js"></script>

</body>

</html>
